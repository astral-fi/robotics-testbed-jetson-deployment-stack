version: "3.8"

services:
  jetson-stack:

    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: jetson-stack

    network_mode: host
    ipc: host

    privileged: true

    runtime: nvidia

    stdin_open: true
    tty: true

    environment:
      DISPLAY: ${DISPLAY}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all

    volumes:

      # Workspace
      - ./workspace:/workspaces/jetson-stack

      # Config
      - ./config:/config

      # Launch files
      - ./launch:/launch

      # Scripts
      - ./scripts:/scripts

      # USB devices (FLIR)
      - /dev:/dev
      - /dev/bus/usb:/dev/bus/usb

      # X11 (RViz/Foxglove if needed)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    working_dir: /workspaces/jetson-stack

    command: bash